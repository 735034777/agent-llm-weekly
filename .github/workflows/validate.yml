name: Validate weekly

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test editorial safeguards
        run: python -m unittest discover -s tests -v
      - name: Validate content and generated files
        run: python scripts/build.py --check

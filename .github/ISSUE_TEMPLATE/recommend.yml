name: 推荐来源或项目
description: 提交可核实的论文、工程文章、开源项目或评测
title: '[推荐] '
body:
  - type: input
    id: source
    attributes:
      label: 原始链接
      description: 优先提供作者、论文或官方仓库链接。
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 更新日期与推荐理由
      description: 发生了什么变化，为什么值得读？
    validations:
      required: true
